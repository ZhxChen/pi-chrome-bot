###############################################################################
# pi-chrome-bot — deployment file
#
# No need to clone the repo; just download this one file and the (optional)
# certificate helper.
#
# Quick start:
#   curl -fsSL -O https://raw.githubusercontent.com/ZhxChen/pi-chrome-bot/main/docker-compose.yml
#   docker compose up -d
#   open https://192.168.1.10:30141  # pi-web + embedded Chrome
#
# On first start, pi auto-generates a self-signed cert into ./data/proxy
# for localhost by default. Reuse persists across restarts.
#
# After first start, authenticate an LLM provider in pi-web (Models/Auth).
# Credentials are persisted to ./data/app and restored on restart.
#
# Data directories (auto-created):
#   ./data/chrome  — Chrome user data (cookies, bookmarks, extensions)
#   ./data/app     — pi state, credentials, sessions (~/.pi)
#   ./data/proxy   — persistent TLS certificate for the public proxy
#
# Updating:
#   docker compose pull && docker compose up -d
#
# Upgrading from the old 3-service stack: run
# `docker compose down` first, then `docker compose up -d` with this file.
# The `cdp-proxy` container disappearing is expected — its TLS/proxy logic
# now runs inside the `pi` container.
#
# Security: the proxy exposes agent and desktop control on all IPv4 interfaces
# by default. Use a VPN or authenticated reverse proxy and never expose it to
# untrusted networks.
###############################################################################

services:
  chrome:
    image: lscr.io/linuxserver/chromium:latest
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      # - TZ=Asia/Shanghai
      # - LC_ALL=zh_CN.UTF-8
      - CHROME_CLI=--remote-debugging-port=9222 --remote-debugging-address=127.0.0.1 --remote-allow-origins=http://localhost --no-first-run
      - SELKIES_MANUAL_WIDTH=1920
      - SELKIES_MANUAL_HEIGHT=1080
      - SELKIES_IS_MANUAL_RESOLUTION_MODE=true
    ports:
      # pi shares this network namespace. Every published target is pi's
      # Nginx listener; Chromium's own CDP port has no direct host mapping.
      # Defaults to all IPv4 interfaces. To make it local-only, use:
      # - "127.0.0.1:30141:8443"
      - "30141:8443"
    shm_size: "2gb"
    volumes:
      - ./data/chrome:/config

  pi:
    image: ghcr.io/zhxchen/pi-chrome-bot:latest
    # pull_policy: always
    restart: unless-stopped
    network_mode: "service:chrome"
    environment:
      # Optional SAN override for the auto-generated self-signed certificate:
      # - PUBLIC_HOST=pi-bot.lan
      - PI_WEB_PORT=30141
      - TZ=Asia/Shanghai
    volumes:
      - ./data/app:/root
      # Persistent TLS certificate for the public proxy.
      - ./data/proxy:/etc/nginx/certs
      # Persist npm global CLIs (pi, agent-browser, pi-web). First start
      # copies image content; later `pi update --self` / `npm update -g` stick.
      # Reset: docker compose down && docker volume rm <project>_npm_global
      - npm_global:/opt/npm-global
    depends_on:
      - chrome

volumes:
  npm_global:
