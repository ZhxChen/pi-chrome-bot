# /etc/tmux.conf — system-wide tmux config for the `webterm` session that
# hosts omp under ttyd. Read automatically by every tmux invocation.
#
# Placed at /etc/tmux.conf (not ~/.tmux.conf) because the app container
# bind-mounts ./data/app over /root, which would hide a baked ~/.tmux.conf.

# truecolor / 256-color: ttyd advertises xterm-256color to the tmux client.
# Mirror that as the in-session TERM and pass through the Tc (truecolor)
# capability so omp's TUI renders colors faithfully instead of degrading
# under tmux's default `screen` terminal type.
set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Hide tmux's own UI so omp gets the full browser viewport — identical to
# running `ttyd omp` directly. The status line is on by default and steals
# one row (e.g. a 100x30 browser becomes a 100x29 pane), which clips omp's
# bottom UI and is the visible "display incomplete" regression vs direct
# ttyd. With it off, the pane size equals the client size exactly.
set -g status off

# Size the window to the attached client's terminal and resize eagerly on
# every change, so omp always sees the browser's real cols/rows. (`latest'
# is the tmux 3.3 default; set explicitly for clarity / older builds.)
set -g window-size latest
setw -g aggressive-resize on

# Generous scrollback for reviewing agent output.
set -g history-limit 50000

# Let the TUI (and programs inside it) handle mouse events itself.
set -g mouse off

# Number windows/panes from 1 — more intuitive than 0.
set -g base-index 1
setw -g pane-base-index 1
